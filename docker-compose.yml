services:
  iperf-web-client:
    build: .
    container_name: iperf-web-client
    network_mode: host
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    environment:
      - SECRET_KEY=change-me-in-production
      - ENABLE_SYSCTL_TUNING=0
      - ENABLE_POLICY_ROUTING=1
      - ALLOW_VIRTUAL_INTERFACES=1
      - FLOW_RETRIES=2
